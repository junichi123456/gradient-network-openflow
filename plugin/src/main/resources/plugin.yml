name: RaidPlugin
version: 0.1.0
main: jp.mcserver.plugin.RaidPlugin
api-version: '1.21'
description: レイド個体の検証（§12）と村人の取引テーブル（§3.2）
commands:
  raid:
    description: レイドの開催（登録・開始）と個体の検証
    usage: /raid slots|join|leave|solo | /raid spawn|despawn|info|god|calibrate|dump|axes | /raid model authored|vanilla | /raid arena|begin
    permission: raid.test
permissions:
  raid.test:
    description: レイド個体の検証コマンド
    default: op
