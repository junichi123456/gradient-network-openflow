name: RaidPlugin
version: 0.1.0
main: jp.mcserver.plugin.RaidPlugin
api-version: '1.21'
description: レイド個体の検証（§12）と村人の取引テーブル（§3.2）
commands:
  raid:
    description: レイド個体の召喚・除去と検証用の切り替え
    usage: /raid spawn | /raid despawn | /raid info | /raid god | /raid calibrate | /raid dump | /raid model authored|vanilla
    permission: raid.test
permissions:
  raid.test:
    description: レイド個体の検証コマンド
    default: op
