name: Android Debug Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3.0"
  DOTNET_VERSION: "8.0.x"
  EXPORT_NAME: MysteryDungeonRoguelike
  PROJECT_PATH: "."
  ANDROID_PLATFORM: "platforms;android-34"
  ANDROID_BUILD_TOOLS: "build-tools;34.0.0"

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    # Runs directly on the GitHub-hosted runner (no Docker container):
    # ubuntu-24.04 already ships a licensed Android SDK + JDK 17
    # (see actions/runner-images Ubuntu24 readme), so "Android SDK
    # setup" here just means filling in the one package Godot 4.3
    # needs that isn't preinstalled (platform 34) and pointing Godot
    # at the existing SDK - rather than provisioning one from scratch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Godot (.NET/C#) with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Verify toolchain
        run: |
          dotnet --version
          godot --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install the Android SDK packages Godot needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"

      - name: Point Godot's editor settings at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF

      # Debug-only keystore, regenerated fresh every run (this is fine
      # for a downloadable debug APK - it just means each build's
      # signature differs, so testers may need to uninstall the
      # previous debug build before installing a new one).
      - name: Generate a debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "DEBUG_KEYSTORE_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"

      # Runs dotnet build directly (rather than only godot
      # --build-solutions) so any real C# compile error is printed to
      # the log in full, instead of being hidden inside Godot's own
      # MSBuild log file.
      - name: Restore & build the C# project
        run: |
          cd "$PROJECT_PATH"
          dotnet restore
          dotnet build -c Debug

      - name: Import project & generate .NET bindings
        run: |
          cd "$PROJECT_PATH"
          godot --headless --verbose --editor --quit || true
          godot --headless --verbose --build-solutions --quit

      # Normally done once via the editor's Project > Install Android
      # Build Template menu item (extracts android_source.zip from the
      # export templates into res://android/build). This is the
      # headless CLI equivalent, required because gradle_build/
      # use_gradle_build=true (mandatory for C#/.NET Android export)
      # can't produce an APK without that local Gradle project.
      - name: Install Android build template
        run: |
          cd "$PROJECT_PATH"
          echo "--- export_templates dir ---"
          find ~/.local/share/godot/export_templates -maxdepth 1 || true
          godot --headless --verbose --install-android-build-template --quit
          echo "--- android/build after install ---"
          ls -la android/build 2>&1 || echo "android/build was NOT created"

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/android/${EXPORT_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-debug-apk
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 14
