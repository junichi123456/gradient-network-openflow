name: Android Debug Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3.0"
  DOTNET_VERSION: "8.0.x"
  EXPORT_NAME: MysteryDungeonRoguelike
  PROJECT_PATH: "."
  ANDROID_PLATFORM: "platforms;android-34"
  ANDROID_BUILD_TOOLS: "build-tools;34.0.0"

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    # Runs directly on the GitHub-hosted runner (no Docker container):
    # ubuntu-24.04 already ships a licensed Android SDK + JDK 17
    # (see actions/runner-images Ubuntu24 readme), so "Android SDK
    # setup" here just means filling in the one package Godot 4.3
    # needs that isn't preinstalled (platform 34) and pointing Godot
    # at the existing SDK - rather than provisioning one from scratch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Godot (.NET/C#) with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Verify toolchain
        run: |
          dotnet --version
          godot --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install the Android SDK packages Godot needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"

      - name: Point Godot's editor settings at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF

      # Debug-only keystore, regenerated fresh every run (this is fine
      # for a downloadable debug APK - it just means each build's
      # signature differs, so testers may need to uninstall the
      # previous debug build before installing a new one).
      - name: Generate a debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "DEBUG_KEYSTORE_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"

      - name: Import project & generate .NET bindings
        run: |
          cd "$PROJECT_PATH"
          godot --headless --verbose --editor --quit || true
          godot --headless --verbose --build-solutions --quit || exit 0

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/android/${EXPORT_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-debug-apk
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 14
