<title>技データベース エディタ</title>

<style>
  .ed{
    color-scheme:light;
    --plane:#f7f7f5; --surface:#fff; --sunk:#f2f1ee;
    --ink:#111110; --ink-2:#55544f; --ink-muted:#8b8981;
    --line:#e3e2dc; --line-2:#cecdc5;
    --accent:#2a68c4; --accent-soft:#e8f0fb;
    --phys:#2a78d6; --spec:#eb6834; --stat:#1baf7a;
    --warn:#b3540f; --warn-bg:#fdf1e5;
    --dirty:#8a6d00; --dirty-bg:#fdf6dd;
  }
  @media (prefers-color-scheme:dark){
    :root:where(:not([data-theme="light"])) .ed{
      color-scheme:dark;
      --plane:#101010; --surface:#1b1b1a; --sunk:#232322;
      --ink:#f5f5f2; --ink-2:#c1c0b8; --ink-muted:#8b8981;
      --line:#2e2e2b; --line-2:#3d3d39;
      --accent:#5a9bef; --accent-soft:#16283f;
      --phys:#3987e5; --spec:#d95926; --stat:#199e70;
      --warn:#f0a35e; --warn-bg:#2e2113;
      --dirty:#e8c95a; --dirty-bg:#2b2617;
    }
  }
  :root[data-theme="dark"] .ed{
    color-scheme:dark;
    --plane:#101010; --surface:#1b1b1a; --sunk:#232322;
    --ink:#f5f5f2; --ink-2:#c1c0b8; --ink-muted:#8b8981;
    --line:#2e2e2b; --line-2:#3d3d39;
    --accent:#5a9bef; --accent-soft:#16283f;
    --phys:#3987e5; --spec:#d95926; --stat:#199e70;
    --warn:#f0a35e; --warn-bg:#2e2113;
    --dirty:#e8c95a; --dirty-bg:#2b2617;
  }

  .ed{
    background:var(--plane); color:var(--ink); min-height:100%;
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    font-size:14px; line-height:1.55;
  }
  .ed *{box-sizing:border-box}
  .shell{max-width:1240px;margin:0 auto;padding:22px 16px 90px;display:flex;flex-direction:column;gap:14px}

  /* ---- header ---- */
  .top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
  .top h1{font-size:21px;font-weight:670;letter-spacing:-.01em;margin:0}
  .top .meta{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
  .top .spacer{flex:1}
  .btn{
    font:inherit;font-size:13px;font-weight:560;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-2);border-radius:7px;padding:7px 13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{background:var(--sunk)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--sunk)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .dirty-pill{
    font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;
    background:var(--dirty-bg);color:var(--dirty);border:1px solid currentColor;
  }

  /* ---- tabs ---- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
  .tab{
    font:inherit;font-size:13.5px;font-weight:580;color:var(--ink-2);background:none;border:0;
    padding:9px 15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px 4px 0 0}

  /* ---- filters ---- */
  .filters{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px 14px;
  }
  .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .f > label{font-size:11px;font-weight:620;letter-spacing:.04em;color:var(--ink-muted)}
  .f input,.f select{
    font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;width:100%;min-width:0;
  }
  .f input:focus-visible,.f select:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .f .pair{display:flex;align-items:center;gap:5px}
  .f .pair input{width:100%}
  .f .pair span{color:var(--ink-muted);font-size:12px}
  .chks{display:flex;flex-wrap:wrap;gap:4px}
  .chk{
    font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line-2);
    background:var(--surface);color:var(--ink-2);cursor:pointer;user-select:none;
  }
  .chk[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .chk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .filter-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .result{font-size:12.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums}

  /* ---- table ---- */
  .tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:70vh}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;min-width:1050px}
  thead th{
    position:sticky;top:0;z-index:2;background:var(--surface);
    font-size:11px;font-weight:620;color:var(--ink-muted);text-align:right;
    padding:8px 9px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none;
  }
  thead th.l{text-align:left}
  thead th:hover{color:var(--ink)}
  thead th[aria-sort]:not([aria-sort="none"]){color:var(--accent)}
  thead th .arrow{font-size:9px;margin-left:3px}
  tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody td.l{text-align:left;font-variant-numeric:normal}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--sunk)}
  tbody tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--dirty)}
  .cat{display:inline-block;min-width:2.4em;text-align:center;border-radius:4px;color:#fff;font-size:11px;font-weight:650;padding:1px 5px}
  .c物理{background:var(--phys)} .c特殊{background:var(--spec)} .c変化{background:var(--stat)}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--sunk);border:1px solid var(--line-2);color:var(--ink-2)}
  .tag.custom{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .muted{color:var(--ink-muted)}

  /* ---- inline editor (expands under the tapped row) ---- */
  tbody tr.open td{background:var(--accent-soft)}
  tr.editrow > td{padding:0;background:var(--sunk);border-bottom:2px solid var(--line-2);
                  text-align:left;font-variant-numeric:normal;white-space:normal}
  /* sticky+left keeps the panel on screen even when the wide table is
     scrolled horizontally, so it never slides out of view on a phone. */
  .editor{position:sticky;left:0;width:min(880px,92vw);padding:15px 16px 14px;
          display:flex;flex-direction:column;gap:14px}
  .editor h3{font-size:11px;font-weight:640;letter-spacing:.06em;color:var(--ink-muted);
             margin:0 0 7px;text-transform:uppercase}
  .grp{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:9px 14px}
  .row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;min-width:0}
  .row.wide{grid-column:span 2}
  .row > label{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row input,.row select{
    font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-2);border-radius:6px;padding:5px 7px;width:100%;min-width:0;
  }
  .row input:focus-visible,.row select:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .row input[type=checkbox]{width:16px;height:16px;justify-self:start}
  .jsonfield{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.45;
    width:100%;resize:vertical;color:var(--ink);background:var(--sunk);
    border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;white-space:pre;
  }
  .jsonfield:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .editor .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
                     background:var(--sunk);border-radius:4px;padding:1px 4px}
  .editor .hint{margin-top:8px}

  .editor .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .editor .acts .sp{flex:1}
  .btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
  .btn.danger:hover{filter:brightness(1.08)}
  .confirmbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;
    background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:8px 11px;
  }
  .confirmbar span{font-size:12.5px;color:var(--warn);font-weight:560}

  /* ---- output panel (export target) ---- */
  /* Any explicit display: wins over the UA rule behind the hidden attribute,
     so restate it - otherwise #outPanel is stuck open from first paint. */
  [hidden]{display:none !important}
  #outPanel{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;
            display:flex;flex-direction:column;gap:10px}
  #outPanel .oHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #outPanel .oHead strong{font-size:14px}
  #outPanel .oHead .sp{flex:1}
  #outText{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.45;
    width:100%;height:230px;resize:vertical;color:var(--ink);background:var(--sunk);
    border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;white-space:pre;
  }
  #outText:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .hint{font-size:12px;color:var(--ink-2)}

  .note{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:7px;padding:8px 10px}

  /* ---- tags view ---- */
  .taglist{display:flex;flex-direction:column;gap:8px}
  .tagcard{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 15px;
    display:grid;grid-template-columns:140px 1fr auto;gap:12px;align-items:center;
  }
  .tagcard input{
    font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;width:100%;
  }
  .tagcard input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .tagcard .use{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tagcard.builtin{background:var(--sunk)}
  .badge{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-muted);white-space:nowrap}
  .badge.new{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .addrow .f{flex:1 1 150px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .card h3{font-size:13.5px;font-weight:640;margin:0 0 8px}
  .card p{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
  .card p:last-child{margin-bottom:0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);z-index:60;
    background:var(--ink);color:var(--plane);font-size:13px;padding:9px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
  }
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
  /* Two editor columns need ~380px of panel to stay legible; below that the
     inner inputs collapse to ~80px and the labels win the space war. Drop to
     one column rather than shrink further. */
  @media (max-width:560px){
    .grid{grid-template-columns:1fr}
    .row.wide{grid-column:span 1}
    .row{grid-template-columns:88px 1fr}
    .tagcard{grid-template-columns:1fr;gap:8px}
    .editor{width:min(880px,94vw);padding:12px 12px 12px}
  }
</style>

<div class="ed"><div class="shell">

  <div class="top">
    <div>
      <h1>技データベース エディタ</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="spacer"></div>
    <span class="dirty-pill" id="dirtyPill" hidden></span>
    <button class="btn ghost" id="btnRevert" disabled>変更を破棄</button>
    <button class="btn" id="btnTags">weapon_tags.json</button>
    <button class="btn primary" id="btnExport">moves.json を書き出す</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabMoves" aria-selected="true">技リスト</button>
    <button class="tab" role="tab" id="tabTags" aria-selected="false">ウェポンタグ</button>
  </div>

  <section id="outPanel" hidden>
    <div class="oHead">
      <strong id="outName">moves.json</strong>
      <span class="hint" id="outMeta"></span>
      <span class="sp"></span>
      <button class="btn primary" id="outCopy">全文をコピー</button>
      <button class="btn" id="outDownload">ファイルとして保存</button>
      <button class="btn ghost" id="outClose">閉じる</button>
    </div>
    <textarea id="outText" readonly spellcheck="false"></textarea>
    <p class="hint" id="outHint"></p>
  </section>

  <!-- ============ MOVES ============ -->
  <section id="viewMoves" style="display:flex;flex-direction:column;gap:12px">

    <div class="filters">
      <div class="f"><label for="fq">検索（技名 / ID）</label><input type="search" id="fq" placeholder="ぐれんげき / MVP_021"></div>

      <div class="f"><label>分類</label><div class="chks" id="fCat"></div></div>
      <div class="f"><label>属性</label><div class="chks" id="fType"></div></div>

      <div class="f"><label for="fRange">対象範囲</label><select id="fRange"></select></div>
      <div class="f"><label for="fTag">ウェポンタグ</label><select id="fTag"></select></div>

      <div class="f"><label for="fContact">接触判定</label><select id="fContact">
        <option value="">指定なし</option><option value="1">接触技のみ</option><option value="0">非接触のみ</option></select></div>

      <div class="f"><label for="fAil">追加効果（状態異常）</label><select id="fAil">
        <option value="">指定なし</option><option value="1">あり</option><option value="0">なし</option></select></div>

      <div class="f"><label for="fAilKind">状態異常の種類</label><select id="fAilKind"></select></div>

      <div class="f"><label for="fRank">ランク変化</label><select id="fRank">
        <option value="">指定なし</option><option value="1">あり</option><option value="0">なし</option></select></div>

      <div class="f"><label for="fMulti">多段ヒット</label><select id="fMulti">
        <option value="">指定なし</option><option value="1">あり</option><option value="0">なし</option>
        <option value="Variable2To5">2〜5発</option><option value="RepeatPerHit">発ごと命中</option></select></div>

      <div class="f"><label for="fExtra">その他の効果</label><select id="fExtra">
        <option value="">指定なし</option>
        <option value="recoil">反動あり</option><option value="drain">ドレインあり</option>
        <option value="crit">急所ランク+</option><option value="guaranteed">必中</option>
        <option value="dragon">ダメージ倍率あり</option><option value="field">設置技</option>
        <option value="selfdeath">自滅</option><option value="selfstun">使用後スタン</option></select></div>

      <div class="f"><label>威力</label><div class="pair">
        <input type="number" id="fPwMin" placeholder="下限" min="0"><span>〜</span><input type="number" id="fPwMax" placeholder="上限" min="0"></div></div>

      <div class="f"><label>命中率</label><div class="pair">
        <input type="number" id="fAcMin" placeholder="下限" min="0" max="100"><span>〜</span><input type="number" id="fAcMax" placeholder="上限" min="0" max="100"></div></div>

      <div class="f"><label>PP</label><div class="pair">
        <input type="number" id="fPpMin" placeholder="下限" min="0"><span>〜</span><input type="number" id="fPpMax" placeholder="上限" min="0"></div></div>
    </div>

    <div class="filter-foot">
      <button class="btn ghost" id="btnClear">絞込みを解除</button>
      <span class="result" id="result"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="btnNew">技を新規追加</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <!-- ============ TAGS ============ -->
  <section id="viewTags" style="display:none;flex-direction:column;gap:12px">
    <div class="card">
      <h3>ウェポンタグとは</h3>
      <p>
        特性「いっせん」（斬る系の与ダメージ+10%）と「ツメのかりうど」（ツメ・こぶし系+10%）、
        「発煙器官」（ブレス/息系の威力+10）が参照する技のグループです。
      </p>
      <p class="note" id="tagWarn" hidden></p>
    </div>

    <div class="card">
      <h3>タグを追加</h3>
      <div class="addrow">
        <div class="f"><label for="ntId">ID（英数字）</label><input id="ntId" placeholder="Pierce"></div>
        <div class="f"><label for="ntName">表示名</label><input id="ntName" placeholder="貫く系"></div>
        <div class="f"><label for="ntNote">説明</label><input id="ntNote" placeholder="突き技のグループ"></div>
        <button class="btn primary" id="btnAddTag">追加</button>
      </div>
    </div>

    <div class="taglist" id="tagList"></div>
  </section>

</div></div>

<div class="toast" id="toast"></div>

// window.confirm() is disabled inside the artifact's sandboxed iframe - the
// call is ignored and reads as "cancel", so every delete silently did nothing.
// This is a two-step inline confirmation instead, which needs no modal
// permission and works the same everywhere.
function askConfirm(host, message, onYes){
  host.querySelectorAll(".confirmbar").forEach(b => b.remove());
  const bar = document.createElement("div");
  bar.className = "confirmbar";
  const label = document.createElement("span"); label.textContent = message;
  const yes = document.createElement("button"); yes.className = "btn danger"; yes.textContent = "実行する";
  const no  = document.createElement("button"); no.className = "btn ghost";  no.textContent = "キャンセル";
  bar.append(label, yes, no);
  host.appendChild(bar);
  yes.addEventListener("click", () => { bar.remove(); onYes(); });
  no.addEventListener("click", () => bar.remove());
  yes.focus();
}

/* ============================ toast ============================ */
let toastT;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ============================ filter UI ============================ */
function chipSet(host, values, labels, set){
  host.innerHTML = "";
  values.forEach(v => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chk"; b.textContent = labels[v] || v;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      if (set.has(v)) set.delete(v); else set.add(v);
      b.setAttribute("aria-pressed", set.has(v) ? "true" : "false");
      render();
    });
    host.appendChild(b);
  });
}
function fillSelect(sel, values, labels, allLabel){
  sel.innerHTML = "";
  const o = document.createElement("option"); o.value = ""; o.textContent = allLabel; sel.appendChild(o);
  values.forEach(v => {
    const op = document.createElement("option"); op.value = v; op.textContent = labels ? (labels[v]||v) : v;
    sel.appendChild(op);
  });
}

function buildFilters(){
  chipSet($("fCat"), CATS, CAT_JA, filters.cat);
  chipSet($("fType"), TYPES, TYPE_JA, filters.type);
  fillSelect($("fRange"), RANGES, RANGE_JA, "指定なし");
  fillSelect($("fAilKind"), AILS.filter(a=>a!=="None"), AIL_JA, "指定なし");
  refreshTagSelect();

  const bind = (id, key, ev) => $(id).addEventListener(ev || "input", e => { filters[key] = e.target.value; render(); });
  bind("fq","q"); bind("fRange","range","change"); bind("fTag","tag","change");
  bind("fContact","contact","change"); bind("fAil","ail","change"); bind("fAilKind","ailKind","change");
  bind("fRank","rank","change"); bind("fMulti","multi","change"); bind("fExtra","extra","change");
  ["fPwMin","fPwMax","fAcMin","fAcMax","fPpMin","fPpMax"].forEach(id => {
    const key = id.slice(1); const k = key.charAt(0).toLowerCase()+key.slice(1);
    $(id).addEventListener("input", e => { filters[k] = e.target.value; render(); });
  });

  $("btnClear").addEventListener("click", () => {
    filters.q=""; filters.range=""; filters.tag=""; filters.contact=""; filters.ail="";
    filters.ailKind=""; filters.rank=""; filters.multi=""; filters.extra="";
    filters.pwMin=filters.pwMax=filters.acMin=filters.acMax=filters.ppMin=filters.ppMax="";
    filters.cat.clear(); filters.type.clear();
    ["fq","fRange","fTag","fContact","fAil","fAilKind","fRank","fMulti","fExtra",
     "fPwMin","fPwMax","fAcMin","fAcMax","fPpMin","fPpMax"].forEach(id => $(id).value = "");
    document.querySelectorAll(".chk").forEach(b => b.setAttribute("aria-pressed","false"));
    render();
  });
}
function refreshTagSelect(){
  const cur = $("fTag").value;
  fillSelect($("fTag"), tags.map(t=>t.id), Object.fromEntries(tags.map(t=>[t.id,t.name])), "指定なし");
  $("fTag").value = cur;
}

/* ============================ filtering ============================ */
function passes(m){
  const f = filters;
  if (f.q){
    const q = f.q.toLowerCase();
    if (!(m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q))) return false;
  }
  if (f.cat.size && !f.cat.has(m.category)) return false;
  if (f.type.size && !f.type.has(m.type)) return false;
  if (f.range && m.range !== f.range) return false;
  if (f.tag && get(m,"weapon_tag") !== f.tag) return false;

  if (f.contact !== "" && (get(m,"is_contact") ? "1" : "0") !== f.contact) return false;

  const hasAil = get(m,"ailment_effect") !== "None";
  if (f.ail !== "" && (hasAil ? "1" : "0") !== f.ail) return false;
  if (f.ailKind && get(m,"ailment_effect") !== f.ailKind) return false;

  const hasRank = rankEffectList(m).length > 0;
  if (f.rank !== "" && (hasRank ? "1" : "0") !== f.rank) return false;

  const mh = get(m,"multi_hit");
  if (f.multi === "1" && mh === "None") return false;
  if (f.multi === "0" && mh !== "None") return false;
  if (f.multi === "Variable2To5" || f.multi === "RepeatPerHit") { if (mh !== f.multi) return false; }

  switch (f.extra){
    case "recoil":      if (!get(m,"recoil_hp_percent")) return false; break;
    case "drain":       if (!get(m,"drain_hp_percent")) return false; break;
    case "crit":        if (!get(m,"crit_rank_bonus")) return false; break;
    case "guaranteed":  if (!get(m,"is_guaranteed_hit")) return false; break;
    case "dragon":      if (get(m,"dragon_multiplier") === 1.0) return false; break;
    case "field":       if (get(m,"field_placement") === "None") return false; break;
    case "selfdeath":   if (!get(m,"self_guaranteed_death")) return false; break;
    case "selfstun":    if (!get(m,"self_stun_next_turn")) return false; break;
  }

  const num = (v, lo, hi) => (lo === "" || v >= +lo) && (hi === "" || v <= +hi);
  if (!num(m.power,    f.pwMin, f.pwMax)) return false;
  if (!num(m.accuracy, f.acMin, f.acMax)) return false;
  if (!num(m.max_pp,   f.ppMin, f.ppMax)) return false;
  return true;
}

/* ============================ table ============================ */
const COLS = [
  {k:"id",       t:"ID",     l:true,  v:m=>m.id},
  {k:"name",     t:"技名",   l:true,  v:m=>m.name},
  {k:"type",     t:"属性",   l:false, v:m=>TYPE_JA[m.type]||m.type},
  {k:"category", t:"分類",   l:false, v:m=>`<span class="cat c${CAT_JA[m.category]}">${CAT_JA[m.category]}</span>`, s:m=>m.category},
  {k:"power",    t:"威力",   l:false, v:m=>m.power||'<span class="muted">—</span>', s:m=>m.power},
  {k:"accuracy", t:"命中",   l:false, v:m=>m.accuracy},
  {k:"max_pp",   t:"PP",     l:false, v:m=>m.max_pp},
  {k:"range",    t:"範囲",   l:false, v:m=>RANGE_JA[m.range]||m.range, s:m=>m.range},
  {k:"is_contact", t:"接触", l:false, v:m=>get(m,"is_contact")?"接触":'<span class="muted">—</span>', s:m=>get(m,"is_contact")?1:0},
  {k:"ailment_effect", t:"追加効果", l:true, s:m=>get(m,"ailment_effect"),
   v:m=>{const a=get(m,"ailment_effect"); return a==="None" ? '<span class="muted">—</span>'
        : `${AIL_JA[a]||a} <span class="muted">${get(m,"ailment_chance")}%</span>`;}},
  {k:"weapon_tag", t:"タグ", l:true, s:m=>get(m,"weapon_tag"),
   v:m=>{const t=get(m,"weapon_tag"); if(t==="None") return '<span class="muted">—</span>';
        const known=tags.find(x=>x.id===t); const custom=!BUILTIN_TAGS.includes(t);
        return `<span class="tag${custom?" custom":""}">${known?known.name:t}</span>`;}},
  {k:"rank_effects", t:"ランク変化", l:true, s:m=>rankSummary(m),
   v:m=>{const t=rankSummary(m); return t ? t : '<span class="muted">—</span>';}},
  {k:"weather_effect", t:"天候", l:false, s:m=>get(m,"weather_effect"),
   v:m=>{const x=get(m,"weather_effect"); return x==="None" ? '<span class="muted">—</span>'
        : `${WEATHER_JA[x]||x} <span class="muted">${get(m,"weather_turns")}T</span>`;}},
  {k:"multi_hit", t:"多段", l:false, s:m=>get(m,"multi_hit"),
   v:m=>{const x=get(m,"multi_hit"); if(x==="None") return '<span class="muted">—</span>';
        return x==="Variable2To5" ? "2〜5発" : `${get(m,"multi_hit_count")}発`;}},
];

function buildHead(){
  const tr = $("head"); tr.innerHTML = "";
  COLS.forEach(c => {
    const th = document.createElement("th");
    th.className = c.l ? "l" : "";
    th.textContent = c.t;
    th.setAttribute("aria-sort","none");
    th.tabIndex = 0;
    const go = () => {
      if (sortKey === c.k) sortDir = -sortDir; else { sortKey = c.k; sortDir = 1; }
      render();
    };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") { e.preventDefault(); go(); } });
    tr.appendChild(th);
  });
}

function render(){
  const list = moves.filter(passes);
  const col = COLS.find(c => c.k === sortKey) || COLS[0];
  const keyOf = col.s || (m => m[col.k]);
  list.sort((a,b) => {
    const x = keyOf(a), y = keyOf(b);
    if (x === y) return a.id.localeCompare(b.id);
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
  });

  $("head").querySelectorAll("th").forEach((th,i) =>
    th.setAttribute("aria-sort", COLS[i].k === sortKey ? (sortDir>0?"ascending":"descending") : "none"));
  $("head").querySelectorAll("th").forEach((th,i) => {
    const base = COLS[i].t;
    th.textContent = COLS[i].k === sortKey ? base + (sortDir>0 ? " ▲" : " ▼") : base;
  });

  $("rows").innerHTML = list.map(m => {
    const d = isDirty(m);
    return `<tr data-id="${m.id}" class="${d?"dirty":""}">` +
      COLS.map(c => `<td class="${c.l?"l":""}">${c.v(m)}</td>`).join("") + "</tr>";
  }).join("");
  $("rows").querySelectorAll("tr").forEach(tr =>
    tr.addEventListener("click", () => toggleRow(tr.dataset.id)));

  // Re-mount the open editor after every re-render (sort/filter/edit all
  // rebuild tbody). If the open move no longer passes the filter it simply
  // stays closed rather than vanishing silently mid-edit.
  if (openId){
    const tr = $("rows").querySelector(`tr[data-id="${CSS.escape(openId)}"]`);
    if (tr) mountEditor(tr); else openId = null;
  }

  $("result").textContent = `${list.length} 件を表示（全 ${moves.length} 技）`;
  const n = dirtyCount();
  $("dirtyPill").hidden = n === 0;
  $("dirtyPill").textContent = `未書き出しの変更 ${n} 件`;
  $("btnRevert").disabled = n === 0;
  $("meta").textContent = `${moves.length} 技 · ${tags.length-1} タグ`;
}

/* ============================ inline editor ============================ */
function field(label, inner, wide){ return `<div class="row${wide?" wide":""}"><label>${label}</label>${inner}</div>`; }
function sel(id, values, labels, cur){
  return `<select id="${id}">` + values.map(v =>
    `<option value="${v}"${v===cur?" selected":""}>${labels?(labels[v]||v):v}</option>`).join("") + "</select>";
}
// The rank_effects array as editable text. Empty string when the move has
// none, so the textarea reads as "nothing here" rather than "[]".
function rankEffectsText(m){
  return Array.isArray(m.rank_effects) && m.rank_effects.length
    ? JSON.stringify(m.rank_effects, null, 1) : "";
}

function numI(id, cur, extra){ return `<input type="number" id="${id}" value="${cur}" ${extra||""}>`; }
function chkI(id, cur){ return `<input type="checkbox" id="${id}"${cur?" checked":""}>`; }
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function editorHTML(m){
  const tagIds = tags.map(t => t.id);
  const curTag = get(m,"weapon_tag");

      ${field("威力", numI("e_power", m.power, 'min="0"'))}

      ${field("対象範囲", sel("e_range", RANGES, RANGE_JA, m.range))}
      ${field("接触判定", chkI("e_is_contact", get(m,"is_contact")))}
      ${field("必中", chkI("e_is_guaranteed_hit", get(m,"is_guaranteed_hit")))}
      ${field("確定急所", chkI("e_guaranteed_crit", get(m,"guaranteed_crit")))}
      ${field("ウェポンタグ", sel("e_weapon_tag", tagIds, tagLabels, curTag))}
    </div></div>

    <div class="grp"><h3>状態異常</h3><div class="grid">
      ${field("種類", sel("e_ailment_effect", AILS, AIL_JA, get(m,"ailment_effect")))}
      ${field("確率(%)", numI("e_ailment_chance", get(m,"ailment_chance"), 'min="0" max="100"'))}
      ${field("対象", sel("e_ailment_target", TARGETS, TARGET_JA, get(m,"ailment_target")))}
    </div></div>

      ${field("増減", numI("e_rank_effect_delta", get(m,"rank_effect_delta")))}
      ${field("対象", sel("e_rank_effect_target", TARGETS, TARGET_JA, get(m,"rank_effect_target")))}
      ${field("発動率", numI("e_rank_effect_chance", get(m,"rank_effect_chance"), 'min="0" max="1" step="0.05"'))}
      ${field("複数ランク", `<textarea id="e_rank_effects" class="jsonfield" spellcheck="false" rows="4">${esc(rankEffectsText(m))}</textarea>`, true)}
    </div>
    <p class="hint">
      1つだけ変えるなら上の4項目を使ってください。2つ以上変える技は「複数ランク」に
      JSON配列で書きます（例: <code>[{"stat":"Atk","delta":1,"target":"Self","chance":1},
      {"stat":"Def","delta":1,"target":"Self","chance":1}]</code>）。
      配列が入っているとエンジンはそちらだけを読み、上の4項目は無視されます。
    </p></div>

    <div class="grp"><h3>多段ヒット</h3><div class="grid">

    </div></div>

      <span class="sp"></span>

// Inserts the editor as a full-width row directly beneath the tapped one.
// No fixed positioning anywhere - the panel is part of table flow, so it
// cannot be clipped by a stacking context or trap its own scroll.
function mountEditor(tr){
  const m = moves.find(x => x.id === tr.dataset.id); if (!m) return;
  tr.classList.add("open");
  const er = document.createElement("tr");
  er.className = "editrow";
  const td = document.createElement("td");
  td.colSpan = COLS.length;
  td.innerHTML = editorHTML(m);
  er.appendChild(td);
  tr.after(er);

  td.addEventListener("click", e => e.stopPropagation());   // don't re-toggle the parent row
  $("eSave").addEventListener("click", saveEditor);
  $("eClose").addEventListener("click", () => { openId = null; render(); });
  $("eReset").addEventListener("click", () => {
    const src = original.get(openId);
    if (!src){ toast("この技は新規追加なので戻す元がありません"); return; }
    moves[moves.findIndex(x => x.id === openId)] = JSON.parse(src);
    render(); toast("元に戻しました");
  });
  $("eDup").addEventListener("click", () => {
    const cur = moves.find(x => x.id === openId); if (!cur) return;
    let n = 2, id = `${cur.id}_copy`;
    while (moves.some(x => x.id === id)) id = `${cur.id}_copy${n++}`;
    moves.splice(moves.indexOf(cur)+1, 0, Object.assign({}, cur, {id, name: cur.name + "（複製）"}));
    openId = id; render(); toast(`${id} を作成しました`);
  });
  $("eDel").addEventListener("click", e => {
    const cur = moves.find(x => x.id === openId); if (!cur) return;
    askConfirm(e.target.closest(".editor"), `${cur.name}（${cur.id}）を削除します。`, () => {
      moves.splice(moves.indexOf(cur),1);
      openId = null; render(); toast("削除しました");
    });
  });
}

function toggleRow(id){
  openId = (openId === id) ? null : id;
  render();
  if (openId){
    const tr = $("rows").querySelector(`tr[data-id="${CSS.escape(openId)}"]`);
    if (tr) tr.scrollIntoView({block:"nearest"});
  }
}

function saveEditor(){
  const m = moves.find(x => x.id === openId); if (!m) return;
  const V = id => $(id).value;
  const N = id => { const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; };
  const B = id => $(id).checked;

  const newId = V("e_id").trim();
  if (!newId){ toast("IDは空にできません"); return; }
  if (newId !== m.id && moves.some(x => x.id === newId)){ toast(`ID「${newId}」は既に使われています`); return; }

  m.id = newId;
  m.name = V("e_name").trim() || m.id;
  m.type = V("e_type"); m.category = V("e_category"); m.range = V("e_range");
  m.power = Math.round(N("e_power")); m.accuracy = Math.round(N("e_accuracy")); m.max_pp = Math.round(N("e_max_pp"));
  m.is_contact = B("e_is_contact"); m.is_guaranteed_hit = B("e_is_guaranteed_hit");
  m.guaranteed_crit = B("e_guaranteed_crit");
  m.weapon_tag = V("e_weapon_tag");
  m.ailment_effect = V("e_ailment_effect");
  m.ailment_chance = Math.round(N("e_ailment_chance"));
  m.ailment_target = V("e_ailment_target");
  m.rank_effect_stat = V("e_rank_effect_stat");
  m.rank_effect_delta = Math.round(N("e_rank_effect_delta"));
  m.rank_effect_target = V("e_rank_effect_target");
  m.rank_effect_chance = N("e_rank_effect_chance");

  // Multi-rank list. Blank clears it; anything unparseable aborts the save
  // rather than silently discarding what was typed.
  const rawRank = $("e_rank_effects").value.trim();
  if (!rawRank){
    delete m.rank_effects;
  } else {
    let parsed;
    try { parsed = JSON.parse(rawRank); }
    catch(e){ toast("複数ランクのJSONが読めません: " + e.message); return; }
    if (!Array.isArray(parsed)){ toast("複数ランクは配列で書いてください"); return; }
    for (const e of parsed){
      if (!e || typeof e !== "object"){ toast("複数ランクの要素はオブジェクトにしてください"); return; }
      if (!RANKS.includes(e.stat)){ toast(`stat「${e.stat}」は未知のランクです`); return; }
      if (typeof e.delta !== "number" || !Number.isInteger(e.delta)){ toast("delta は整数にしてください"); return; }
      if (e.target !== undefined && !TARGETS.includes(e.target)){ toast(`target「${e.target}」は Self か Enemy です`); return; }
      if (e.chance !== undefined && typeof e.chance !== "number"){ toast("chance は数値にしてください"); return; }
    }
    m.rank_effects = parsed;
  }
  m.weather_effect = V("e_weather_effect");
  m.weather_turns = Math.round(N("e_weather_turns"));
  m.multi_hit = V("e_multi_hit");
  m.multi_hit_count = Math.round(N("e_multi_hit_count"));
  m.crit_rank_bonus = Math.round(N("e_crit_rank_bonus"));
  m.recoil_hp_percent = Math.round(N("e_recoil_hp_percent"));
  m.drain_hp_percent = Math.round(N("e_drain_hp_percent"));
  m.dragon_multiplier = N("e_dragon_multiplier");
  m.self_stun_next_turn = B("e_self_stun_next_turn");
  m.self_guaranteed_death = B("e_self_guaranteed_death");
  m.field_effect = V("e_field_effect");
  m.field_placement = V("e_field_placement");

  // Fold defaults away immediately so the row's dirty mark reflects real change.
  const clean = normalise(m);
  for (const k of Object.keys(m)) delete m[k];
  Object.assign(m, clean);

  openId = m.id;
  render(); checkTags(); toast(`${m.name} を保存しました`);
}

/* ============================ tags view ============================ */
function tagUsage(id){ return moves.filter(m => get(m,"weapon_tag") === id).length; }

function renderTags(){
  $("tagList").innerHTML = tags.map((t,i) => `
    <div class="tagcard${t.builtin?" builtin":""}">
      <div>
        <input value="${t.id}" data-i="${i}" data-k="id" ${t.builtin?"disabled":""}>
        <span class="badge${t.builtin?"":" new"}">${t.builtin?"組込み":"追加タグ"}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input value="${(t.name||"").replace(/"/g,"&quot;")}" data-i="${i}" data-k="name" placeholder="表示名" style="flex:1 1 120px">
        <input value="${(t.note||"").replace(/"/g,"&quot;")}" data-i="${i}" data-k="note" placeholder="説明" style="flex:2 1 180px">
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="use">${tagUsage(t.id)} 技</span>
        ${t.id==="None" ? "" : `<button class="btn ghost" data-del="${i}" style="color:var(--warn)">削除</button>`}
      </div>
    </div>`).join("");

  $("tagList").querySelectorAll("input[data-k]").forEach(inp => {
    inp.addEventListener("change", e => {
      const i = +e.target.dataset.i, k = e.target.dataset.k, v = e.target.value.trim();
      if (k === "id"){
        const old = tags[i].id;
        if (!v){ toast("IDは空にできません"); renderTags(); return; }
        if (tags.some((t,j) => j!==i && t.id===v)){ toast(`ID「${v}」は既にあります`); renderTags(); return; }
        moves.forEach(m => { if (get(m,"weapon_tag") === old) m.weapon_tag = v; });
        tags[i].id = v;
      } else tags[i][k] = v;
      renderTags(); refreshTagSelect(); render(); checkTags();
    });
  });
  $("tagList").querySelectorAll("button[data-del]").forEach(b => {
    b.addEventListener("click", e => {
      const i = +e.target.dataset.del, t = tags[i], used = tagUsage(t.id);
      if (t.builtin){ toast("組込みタグは削除できません"); return; }
      const doDelete = () => {
        moves.forEach(m => { if (get(m,"weapon_tag") === t.id) m.weapon_tag = "None"; });
        tags.splice(i,1);
        renderTags(); refreshTagSelect(); render(); checkTags();
        toast("タグを削除しました");
      };
      if (!used) { doDelete(); return; }
      askConfirm(e.target.closest(".tagcard"),
        `「${t.name||t.id}」は ${used} 技で使用中です。削除して未設定に戻します。`, doDelete);
    });
  });
  checkTags();
}

// Any tag outside the C# enum is inert in game until the engine is updated -
// say so plainly rather than letting an export look complete when it isn't.
function checkTags(){
  const custom = tags.filter(t => !BUILTIN_TAGS.includes(t.id));
  const used = custom.filter(t => tagUsage(t.id) > 0);
  const w = $("tagWarn");
  if (!custom.length){ w.hidden = true; return; }
  w.hidden = false;
  w.textContent =
    `追加タグ ${custom.length} 件（うち技に割当済み ${used.length} 件）。` +
    `現在の C# 側は WeaponTag が列挙型（None / Slash / Fist / Breath / Wind / Strike / Punch / Thrust / Crush / Rend / Flash）なので、` +
    `列挙にない値は読み込み時に黙って None へ落ちます。` +
    `追加タグをゲーム内で効かせるには、Trait/Ecology と同じくカタログ参照へ変更する必要があります。`;
}

/* ============================ export ============================ */
// Downloads are blocked in the artifact's sandboxed iframe (no allow-downloads),
// so the primary path is: render the JSON into a textarea the user can copy.
// The download button stays as a convenience for when the page is opened
// standalone, where it does work.
let outFilename = "moves.json";

function showOutput(name, text){
  outFilename = name;
  $("outName").textContent = name;
  $("outText").value = text;
  const bytes = new TextEncoder().encode(text).length;
  $("outMeta").textContent = `${text.split("\n").length.toLocaleString()} 行 · ${(bytes/1024).toFixed(1)} KB`;
  $("outHint").textContent =
    "「全文をコピー」でクリップボードに入ります。うまくいかない場合はテキスト欄をタップして全選択してください。" +
    "「ファイルとして保存」はこのページを単体で開いたときに使えます（埋め込み表示ではブラウザ側で抑止されます）。";
  $("outPanel").hidden = false;
  $("outPanel").scrollIntoView({block:"nearest"});
}

async function copyOutput(){
  const ta = $("outText");
  try{
    await navigator.clipboard.writeText(ta.value);
    toast("クリップボードにコピーしました"); return;
  }catch(e){ /* permission or insecure context - fall through */ }
  try{
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    if (document.execCommand("copy")){ toast("クリップボードにコピーしました"); return; }
  }catch(e){ /* ignore */ }
  ta.focus(); ta.select();
  toast("自動コピーができませんでした。全選択したので手動でコピーしてください");
}

function downloadOutput(){
  try{
    const blob = new Blob([$("outText").value], {type:"application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = outFilename; a.rel = "noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("保存を要求しました（抑止された場合はコピーをお使いください）");
  }catch(e){
    toast("この表示ではファイル保存が使えません。コピーをお使いください");
  }
}

function exportMoves(){
  const out = moves.map(normalise);
  showOutput("moves.json", JSON.stringify(out, null, 2) + "\n");
  toast(`moves.json を生成しました（${out.length} 技）`);
}
function exportTags(){
  const out = tags.filter(t => t.id !== "None")
                  .map(t => ({id:t.id, name:t.name, description:t.note||"", builtin:!!t.builtin}));
  showOutput("weapon_tags.json", JSON.stringify(out, null, 2) + "\n");
  toast(`weapon_tags.json を生成しました（${out.length} タグ）`);
}

/* ============================ wiring ============================ */
function switchTab(which){
  const isMoves = which === "moves";
  $("tabMoves").setAttribute("aria-selected", isMoves);
  $("tabTags").setAttribute("aria-selected", !isMoves);
  $("viewMoves").style.display = isMoves ? "flex" : "none";
  $("viewTags").style.display  = isMoves ? "none" : "flex";
  if (!isMoves) renderTags();
}

buildFilters();
buildHead();
render();

$("tabMoves").addEventListener("click", () => switchTab("moves"));
$("tabTags").addEventListener("click", () => switchTab("tags"));
$("btnExport").addEventListener("click", exportMoves);
$("btnTags").addEventListener("click", exportTags);
$("outCopy").addEventListener("click", copyOutput);
$("outDownload").addEventListener("click", downloadOutput);
$("outClose").addEventListener("click", () => { $("outPanel").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && openId){ openId = null; render(); } });

$("btnNew").addEventListener("click", () => {
  let n = 1, id = "NEW_001";
  while (moves.some(x => x.id === id)) id = "NEW_" + String(++n).padStart(3,"0");
  moves.unshift({id, name:"新しい技", type:"Neutral", category:"Physical",
                 power:50, accuracy:100, max_pp:15, range:"Adjacent"});
  openId = id; render();
});
$("btnRevert").addEventListener("click", e => {
  askConfirm(e.target.closest(".top"), "すべての変更を破棄して読み込み時の状態に戻します。", () => {
    moves = MOVES_SEED.map(m => Object.assign({}, m));
    tags = tags.filter(t => t.builtin);
    openId = null;
    render(); refreshTagSelect(); renderTags(); toast("変更を破棄しました");
  });
});
$("btnAddTag").addEventListener("click", () => {
  const id = $("ntId").value.trim(), name = $("ntName").value.trim(), note = $("ntNote").value.trim();
  if (!id){ toast("IDを入力してください"); return; }
  if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(id)){ toast("IDは英字で始まる英数字とアンダースコアのみです"); return; }
  if (tags.some(t => t.id === id)){ toast(`ID「${id}」は既にあります`); return; }
  tags.push({id, name: name || id, note, builtin:false});
  $("ntId").value = $("ntName").value = $("ntNote").value = "";
  renderTags(); refreshTagSelect(); render(); toast(`タグ「${name||id}」を追加しました`);
});

window.addEventListener("beforeunload", e => {
  if (dirtyCount() > 0){ e.preventDefault(); e.returnValue = ""; }
});
})();
</script>
