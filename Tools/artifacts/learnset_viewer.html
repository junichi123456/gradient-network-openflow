<title>learnset インスペクタ — 287種</title>
<style>
:root{
  --ground:#f2f4f2; --surface:#ffffff; --surface-2:#e8ebe8; --sunk:#e2e6e2;
  --ink:#191c21; --ink-2:#48525d; --muted:#6c7683; --line:#dadfda; --line-2:#c4cac5;
  --brass:#8a5f16; --brass-bg:#f2e7d0;
  --el-mu:#7c848d; --el-hi:#c24a26; --el-mi:#2073b8; --el-ku:#3f8c3c; --el-de:#a08016;
  --el-ti:#8a6b3f; --el-ko:#33899d; --el-ry:#6b4bb5; --el-ya:#5d4f70; --el-vo:#8a2f6b;
  --f-ui:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium",sans-serif;
  --f-num:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#13161a; --surface:#1b1f25; --surface-2:#232831; --sunk:#171b20;
    --ink:#e5e9ee; --ink-2:#b2bcc7; --muted:#8a95a2; --line:#2a2f37; --line-2:#3a414b;
    --brass:#d9ab52; --brass-bg:#332a17;
    --el-mu:#a3abb4; --el-hi:#e8734b; --el-mi:#5aa6e0; --el-ku:#6cbf68; --el-de:#d8b53a;
    --el-ti:#c09a63; --el-ko:#5fc0d4; --el-ry:#a084e8; --el-ya:#9b87b5; --el-vo:#d070b0;
  }
}
:root[data-theme="dark"]{
  --ground:#13161a; --surface:#1b1f25; --surface-2:#232831; --sunk:#171b20;
  --ink:#e5e9ee; --ink-2:#b2bcc7; --muted:#8a95a2; --line:#2a2f37; --line-2:#3a414b;
  --brass:#d9ab52; --brass-bg:#332a17;
  --el-mu:#a3abb4; --el-hi:#e8734b; --el-mi:#5aa6e0; --el-ku:#6cbf68; --el-de:#d8b53a;
  --el-ti:#c09a63; --el-ko:#5fc0d4; --el-ry:#a084e8; --el-ya:#9b87b5; --el-vo:#d070b0;
}

body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);
     font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:18px;min-width:0}

.masthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;
          padding-bottom:14px;border-bottom:2px solid var(--ink)}
h1{font-size:19px;font-weight:650;letter-spacing:.01em;margin:0}
.sub{color:var(--muted);font-size:12.5px}
.tally{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-num);font-size:12px;
       font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tally b{color:var(--ink);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0}
.panel-h{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;flex-wrap:wrap}
.panel-t{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---- reachability strip ---- */
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
       background:var(--line);border-radius:0 0 4px 4px;overflow:hidden}
.band{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.band-l{font-family:var(--f-num);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.band-v{font-family:var(--f-num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--el-ku)}
.meter.part i{background:var(--el-de)}
.meter.none i{background:var(--el-hi)}

/* ---- filters ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:3px;padding:5px 9px}
input[type=search]{min-width:190px}
input:focus-visible,select:focus-visible,button:focus-visible,.row:focus-visible{
  outline:2px solid var(--brass);outline-offset:1px}
.chipset{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line-2);
      background:var(--surface);color:var(--ink-2);border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.count{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--muted);
       font-variant-numeric:tabular-nums}

/* ---- two pane ---- */
.pane{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.pane{grid-template-columns:1fr}}

.list{max-height:70vh;overflow-y:auto;overflow-x:hidden}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;
     padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;
     text-align:left;background:none;border-left:0;border-right:0;border-top:0;
     font:inherit;color:inherit}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--brass-bg)}
.row-id{font-family:var(--f-num);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row-n{font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.row-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bst{font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bstbar{width:44px;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bstbar i{display:block;height:100%;background:var(--ink-2)}

/* 狭い画面では一覧の右側を落として、本文が横スクロールしないようにする */
@media (max-width:520px){
  .bstbar{display:none}
  .row{grid-template-columns:32px minmax(0,1fr) auto;gap:6px;padding:7px 9px}
  .row-r{gap:5px}
  .pf{font-size:9.5px;padding:1px 4px}
  .wrap{padding:16px 12px 48px}
}

.el{font-size:10.5px;font-weight:650;padding:1px 5px;border-radius:2px;line-height:1.5;
    border:1px solid currentColor}
.el.mu{color:var(--el-mu)} .el.hi{color:var(--el-hi)} .el.mi{color:var(--el-mi)}
.el.ku{color:var(--el-ku)} .el.de{color:var(--el-de)} .el.ti{color:var(--el-ti)}
.el.ko{color:var(--el-ko)} .el.ry{color:var(--el-ry)} .el.ya{color:var(--el-ya)} .el.vo{color:var(--el-vo)}

.pf{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:2px;
    background:var(--surface-2);color:var(--ink-2);white-space:nowrap}

/* ---- detail ---- */
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;min-width:0;
    flex-wrap:wrap;gap:12px 22px;align-items:flex-start}
.dh-name{font-size:17px;font-weight:650;display:flex;align-items:center;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--f-num);font-size:12px;
       font-variant-numeric:tabular-nums;min-width:0}
.stats div{display:flex;flex-direction:column;gap:1px}
.stats dt{font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stats dd{margin:0;font-size:14px;font-weight:600}
.trait{flex-basis:100%;font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--brass);
       padding-left:10px}
.trait b{color:var(--ink);font-weight:600}

.tblwrap{overflow-x:auto;max-height:62vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surface);z-index:1;
         font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
         font-weight:650;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);
         white-space:nowrap}
tbody td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lv{color:var(--brass);font-weight:600}
.cat{font-family:var(--f-num);font-size:11px;font-weight:600}
.cat.P{color:var(--el-hi)} .cat.S{color:var(--el-mi)} .cat.T{color:var(--muted)}
.tag{font-size:10.5px;color:var(--muted)}
.sig{color:var(--brass);font-weight:650}
.shr{font-family:var(--f-num);font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.shr.hot{color:var(--el-hi)}
.empty{padding:34px 16px;color:var(--muted);text-align:center}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink-2);font-weight:600}
</style>

<div class="wrap">
  <header class="masthead">
    <h1>learnset インスペクタ</h1>
    <span class="sub">Data/species.json &middot; 全287種</span>
    <div class="tally" id="tally"></div>
  </header>

  <section class="panel">
    <div class="panel-h">
      <span class="panel-t">威力帯の到達性</span>
      <span class="note">その威力帯の技のうち、実際に誰かが習得できるものの割合</span>
    </div>
    <div class="bands" id="bands"></div>
  </section>

  <section class="panel">
    <div class="panel-h filters">
      <input type="search" id="q" placeholder="種族名・技名で検索" aria-label="検索">
      <div class="chipset" id="els"></div>
      <div class="chipset" id="ofs" aria-label="攻撃区分"></div>
      <div class="chipset" id="dfs" aria-label="耐久区分"></div>
      <select id="traitf" aria-label="特性で絞り込み"><option value="">特性: 指定なし</option></select>
      <span class="count" id="count"></span>
    </div>
  </section>

  <div class="pane">
    <section class="panel">
      <div class="panel-h"><span class="panel-t">種族</span>
        <select id="sort" aria-label="並び順">
          <option value="id">図鑑番号順</option>
          <option value="bst">種族値合計(BST6)が高い順</option>
          <option value="sp">俊敏(S)が高い順</option>
          <option value="ti">総合耐久指数が高い順</option>
          <option value="mx">最大威力が高い順</option>
          <option value="st">変化技が多い順</option>
          <option value="nt">攻撃属性が多い順</option>
          <option value="ad">特性適応技が少ない順</option>
        </select>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section class="panel">
      <div id="detail"></div>
    </section>
  </div>
</div>

,"p":0,"s":0,"st":23,"ad":0,"mx":0,"nt":0,"mv":[[1,"ディスラプト","無","T",0,"単体","",6,0],[1,"インティミデート","無","T",0,"単体","",6,0],[1,"フォーカスパワー","無","T",0,"単体","",7,0],[1,"コンセントレート","無","T",0,"単体","",6,0],[1,"ボルトルアー","電","T",0,"単体","",6,0],[1,"チャージアップ","電","T",0,"単体","",6,0],[1,"マグネティックバリア","電","T",0,"単体","",4,0],[1,"アクセラレート","電","T",0,"単体","",4,0],[1,"クリアストリームスタンス","水","T",0,"単体","",6,0],[1,"サンドダストスタンス","地","T",0,"単体","",9,0],[1,"ライフスタンス","草","T",0,"単体","",7,0],[1,"リーフハイドスタンス","草","T",0,"単体","",8,0],[4,"カースウィスパー","闇","T",0,"単体","",11,0],[4,"ネザーコール","闇","T",0,"単体","",8,0],[4,"ブルームガーデン","草","T",0,"単体","",3,0],[4,"クレバス","氷","T",0,"単体","",1,0],[4,"レイジングトレント","竜","T",0,"単体","",0,0],[4,"パドル","水","T",0,"単体","",1,0],[4,"サーフェスガード","水","T",0,"単体","",7,0],[4,"サーフェスヴェール","水","T",0,"単体","",7,0],[7,"ラピッドストリームスタンス","水","T",0,"単体","",6,0],[7,"レインダンス","水","T",0,"単体","",8,0],[10,"ディープウォーターピーク","水","T",0,"単体","",8,0]]}]
</script>
<script>
const SP = JSON.parse(document.getElementById('payload').textContent);
const ELS = ['無','炎','水','草','電','地','氷','竜','闇','虚'];
const ELK = {'無':'mu','炎':'hi','水':'mi','草':'ku','電':'de','地':'ti','氷':'ko','竜':'ry','闇':'ya','虚':'vo'};
const OFJA = {Physical:'物理攻撃', Special:'特殊攻撃', Mixed:'両刀攻撃'};
const DFJA = {Physical:'物理耐久', Special:'特殊耐久', Both:'両面耐久'};
const CATJA = {P:'物理', S:'特殊', T:'変化'};
const SIG = 'メガデストラクト';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elChip = t => `<em class="el ${ELK[t]}">${t}</em>`;

// ---- aggregates -------------------------------------------------------
const totalRows = SP.reduce((a, s) => a + s.mv.length, 0);
const lean = {p:0, s:0, e:0};
SP.forEach(s => { s.p > s.s ? lean.p++ : s.s > s.p ? lean.s++ : lean.e++; });
document.getElementById('tally').innerHTML =
  `<span>行 <b>${totalRows.toLocaleString()}</b></span>` +
  `<span>物理寄り <b>${lean.p}</b></span>` +
  `<span>特殊寄り <b>${lean.s}</b></span>` +
  `<span>拮抗 <b>${lean.e}</b></span>`;

// Reachability per power band, measured from the learnsets themselves.
const seen = new Set();
SP.forEach(s => s.mv.forEach(m => { if (m[4] > 0) seen.add(m[1] + '|' + m[4]); }));
const pool = new Map();          // name|power -> power, over every move that appears
SP.forEach(s => s.mv.forEach(m => { if (m[4] > 0) pool.set(m[1] + '|' + m[4], m[4]); }));
// The move list itself is the denominator, so it is passed in as counts per band.
const BANDS = [[15,29],[30,44],[45,59],[60,74],[75,89],[90,104],[105,119],[120,134],[135,149],[180,194]];
const TOTALS = {"15": 57, "30": 82, "45": 92, "60": 82, "75": 91, "90": 82, "105": 59, "120": 21, "135": 2, "180": 1};
const REACH  = {"15": 56, "30": 82, "45": 92, "60": 82, "75": 91, "90": 82, "105": 57, "120": 21, "135": 2, "180": 1};
document.getElementById('bands').innerHTML = BANDS.map(([lo, hi]) => {
  const t = TOTALS[lo], r = REACH[lo], pct = Math.round(r / t * 100);
  const cls = pct === 0 ? 'none' : pct < 60 ? 'part' : '';
  return `<div class="band">
    <span class="band-l">威力 ${lo}–${hi}</span>
    <span class="band-v">${r}<span style="color:var(--muted);font-size:12px">/${t}</span></span>
    <span class="meter ${cls}"><i style="width:${pct}%"></i></span>
  </div>`;
}).join('');

// ---- filters ----------------------------------------------------------
let fEl = null, fOf = null, fDf = null, fQ = '', fSort = 'id', fTrait = '', sel = SP[0].id;

document.getElementById('els').innerHTML =
  ELS.map(t => `<button class="chip" data-el="${t}" aria-pressed="false">${t}</button>`).join('');
document.getElementById('ofs').innerHTML =
  Object.entries(OFJA).map(([k, v]) => `<button class="chip" data-of="${k}" aria-pressed="false">${v}</button>`).join('');

// 特性は99種と多いので、実際に使われているものだけをドロップダウンで絞る
// （名前の五十音順——頻度順だと同じ特性が探すたびに違う位置に来て使いにくい）。
const traitCount = new Map();
SP.forEach(s => traitCount.set(s.tr, (traitCount.get(s.tr) || 0) + 1));
const traitList = [...traitCount.keys()].sort((a, b) => a.localeCompare(b, 'ja'));
document.getElementById('dfs').innerHTML =
  Object.entries(DFJA).map(([k, v]) => `<button class="chip" data-df="${k}" aria-pressed="false">${v}</button>`).join('');
document.getElementById('traitf').insertAdjacentHTML('beforeend',
  traitList.map(t => `<option value="${esc(t)}">${esc(t)} (${traitCount.get(t)})</option>`).join(''));
document.getElementById('traitf').addEventListener('change', e => { fTrait = e.target.value; render(); });

function toggle(group, attr, cur, val, setter) {
  group.querySelectorAll('.chip').forEach(b => {
    const on = b.dataset[attr] === val && cur !== val;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  setter(cur === val ? null : val);
}
document.getElementById('els').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  toggle(e.currentTarget, 'el', fEl, b.dataset.el, v => fEl = v); render();
});
document.getElementById('ofs').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  toggle(e.currentTarget, 'of', fOf, b.dataset.of, v => fOf = v); render();
});
document.getElementById('dfs').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  toggle(e.currentTarget, 'df', fDf, b.dataset.df, v => fDf = v); render();
});
document.getElementById('q').addEventListener('input', e => { fQ = e.target.value.trim(); render(); });
document.getElementById('sort').addEventListener('change', e => { fSort = e.target.value; render(); });

function matches(s) {
  if (fEl && !s.ty.includes(fEl)) return false;
  if (fOf && s.of !== fOf) return false;
  if (fDf && s.df !== fDf) return false;
  if (fTrait && s.tr !== fTrait) return false;
  if (fQ && !(s.n.includes(fQ) || s.tr.includes(fQ) || s.mv.some(m => m[1].includes(fQ)))) return false;
  return true;
}

// ---- render -----------------------------------------------------------
function render() {
  let rows = SP.filter(matches);
  const key = {id: s => s.id, bst: s => -s.bst, sp: s => -s.sp, ti: s => -s.ti, mx: s => -s.mx, st: s => -s.st,
               nt: s => -s.nt, ad: s => s.ad}[fSort];
  rows = rows.slice().sort((a, b) => {
    const ka = key(a), kb = key(b);
    return ka < kb ? -1 : ka > kb ? 1 : a.id < b.id ? -1 : 1;
  });
  document.getElementById('count').textContent = `${rows.length} / ${SP.length} 種`;

  document.getElementById('list').innerHTML = rows.length ? rows.map(s => `
    <button class="row" data-id="${s.id}" aria-current="${s.id === sel}">
      <span class="row-id">${s.id}</span>
      <span class="row-n"><span>${esc(s.n)}</span>${s.ty.map(elChip).join('')}</span>
      <span class="row-r">
        <span class="pf">${OFJA[s.of]}/${DFJA[s.df]}</span>
        <span class="bst">${s.bst}</span>
        <span class="bstbar"><i style="width:${Math.round((s.bst - 320) / 290 * 100)}%"></i></span>
      </span>
    </button>`).join('') : `<p class="empty">該当なし</p>`;

  if (!rows.some(s => s.id === sel) && rows.length) sel = rows[0].id;
  detail(SP.find(s => s.id === sel));
}

function detail(s) {
  if (!s) { document.getElementById('detail').innerHTML = `<p class="empty">種族を選択</p>`; return; }
  const atk = s.mv.filter(m => m[4] > 0);
  const rows = s.mv.map(m => {
    const isSig = m[1] === SIG;
    return `<tr>
      <td class="num lv">${m[0]}</td>
      <td class="${isSig ? 'sig' : ''}">${esc(m[1])}${isSig ? ' <span class="tag">専用</span>' : ''}</td>
      <td>${elChip(m[2])}</td>
      <td class="cat ${m[3]}">${CATJA[m[3]] || m[3]}</td>
      <td class="num">${m[4] || '—'}</td>
      <td class="tag">${m[5]}</td>
      <td class="tag">${m[6] || ''}</td>
      <td class="shr ${m[7] >= 40 ? 'hot' : ''}">${m[7]}%</td>
      <td class="tag">${m[8] ? '<span class="sig">適応</span>' : ''}</td>
    </tr>`;
  }).join('');

  document.getElementById('detail').innerHTML = `
    <div class="dh">
      <div>
        <div class="dh-name">${esc(s.n)} ${s.ty.map(elChip).join('')}
          <span class="pf">${OFJA[s.of]}/${DFJA[s.df]}</span></div>
        <div class="note">図鑑 ${s.id}</div>
      </div>
      <dl class="stats">
        <div><dt>H</dt><dd>${s.hp}</dd></div>
        <div><dt>A 攻撃</dt><dd>${s.a}</dd></div>
        <div><dt>B 防御</dt><dd>${s.b}</dd></div>
        <div><dt>C 魔力</dt><dd>${s.c}</dd></div>
        <div><dt>D 精神</dt><dd>${s.dd}</dd></div>
        <div><dt>S 俊敏(種族値)</dt><dd>${s.sp}</dd></div>
        <div><dt>BST6</dt><dd>${s.bst}</dd></div>
        <div><dt>役割</dt><dd>${OFJA[s.of]}/${DFJA[s.df]}</dd></div>
        <div><dt>総合耐久指数</dt><dd>${s.ti.toLocaleString()}</dd></div>
        <div><dt>攻撃区分の根拠</dt><dd>${s.ob}</dd></div>
      </dl>
      <dl class="stats">
        <div><dt>物理</dt><dd>${s.p}</dd></div>
        <div><dt>特殊</dt><dd>${s.s}</dd></div>
        <div><dt>変化</dt><dd>${s.st}</dd></div>
        <div><dt>最大威力</dt><dd>${s.mx || '—'}</dd></div>
        <div><dt>攻撃属性</dt><dd>${s.nt}</dd></div>
        <div><dt>特性適応技</dt><dd>${s.ad}</dd></div>
      </dl>
      <p class="trait"><b>${esc(s.tr)}</b> — ${esc(s.td || '（説明なし）')}</p>
    </div>
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th class="num">Lv</th><th>技</th><th>属性</th><th>分類</th>
          <th class="num">威力</th><th>射程</th><th>タグ</th><th>共有率</th><th>特性</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  if (!atk.length) {
    document.getElementById('detail').insertAdjacentHTML('beforeend',
      `<p class="note" style="padding:12px 16px">この種族は攻撃技を持たない。特性が攻撃技の使用を禁じているため。</p>`);
  }
}

document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('.row'); if (!b) return;
  sel = b.dataset.id; render();
  document.getElementById('detail').scrollIntoView({block:'nearest', behavior:'smooth'});
});

render();
</script>
